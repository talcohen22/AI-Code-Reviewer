openapi: 3.0.3
info:
  title: AI Code Reviewer API contract
  version: 0.1.0
  description: >-
    The shape a future AI-analysis backend must implement for the UI built so
    far. Nothing implements this yet - the current phase is frontend-only
    against the mock layer in frontend/src/mock/seed.ts, where runReview stands
    in for POST /api/review and the session's React state stands in for GET
    /api/review. Schemas here mirror frontend/src/types/review.ts and the
    ApiContract type in that file; keep the two in step. Array-valued fields
    stay singular per .claude/rules/naming.md. There is no account system in
    this phase, so no endpoint here is authenticated and review history is
    session-scoped rather than user-scoped.
servers:
  - url: /api
    description: Same-origin API root

paths:
  /review:
    post:
      summary: Run a review over a snippet or a single GitHub file
      description: >-
        Backs the code submission view. The client sends either pasted code or
        the contents it imported for a GitHub file link, and the response is the
        completed review the results view renders (AC1, AC2, AC3). The UI
        navigates to /review/{id} on success and surfaces `message` from an
        error response as a sonner toast (AC7). The mock layer answers this in
        ~700ms so the loading state is real; a backend running a model will be
        slower, and the UI's loading state already covers that.
      operationId: createReview
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: The completed review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      summary: List this session's reviews, newest first
      description: >-
        Backs the quality dashboard (AC6). Ordering is strictly
        reverse-chronological by createdAt. An empty item array is a valid
        response and renders the "No reviews yet" empty state (AC7).
      operationId: listReview
      tags: [review]
      responses:
        "200":
          description: One page of past reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

  /review/{id}:
    get:
      summary: Read one review
      description: >-
        Backs a direct visit to /review/{id}. While history is session-scoped
        and in-memory, the UI resolves the id locally and falls back to an empty
        state when it is unknown; a backend implementing this endpoint makes a
        review link durable.
      operationId: getReview
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  responses:
    BadRequest:
      description: >-
        The submission was empty, or a supplied githubUrl was not a
        github.com/{owner}/{repo}/blob/{branch}/{path} file link (AC2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The snippet exceeded the 20,000 character limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such review
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Surfaced to the user as a sonner toast (AC7).

    Severity:
      type: string
      enum: [critical, warning, info]

    FindingCategory:
      type: string
      description: The buckets the results view groups findings into (AC3).
      enum: [style, bug, security, refactor]

    ReviewSource:
      type: string
      enum: [paste, github]

    ReviewRequest:
      type: object
      required: [source, code, file, language]
      properties:
        source:
          $ref: "#/components/schemas/ReviewSource"
        code:
          type: string
          maxLength: 20000
          description: The code to review. Must not be blank.
        file:
          type: string
          description: >-
            The GitHub path for an imported file, or a stand-in name such as
            snippet.ts for a pasted snippet. Findings reference it.
        language:
          type: string
          description: Monaco language id, e.g. typescript.
        githubUrl:
          type: string
          description: Present only when source is "github".

    Finding:
      type: object
      required: [id, category, severity, title, description, file, line, suggestion]
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/FindingCategory"
        severity:
          $ref: "#/components/schemas/Severity"
        title:
          type: string
        description:
          type: string
        file:
          type: string
        line:
          type: integer
          minimum: 1
          description: 1-based line number inside `file`.
        suggestion:
          type: string

    GeneratedTest:
      type: object
      description: One test per reviewed function (AC5).
      required: [id, functionName, framework, code]
      properties:
        id:
          type: string
        functionName:
          type: string
        framework:
          type: string
          description: Test framework the snippet is written for, e.g. vitest.
        code:
          type: string

    ReviewSummary:
      type: object
      description: >-
        Precomputed counts the dashboard renders per row (AC6). style + bug +
        security + refactor equals total, as does critical + warning + info.
      required:
        - style
        - bug
        - security
        - refactor
        - generatedTest
        - critical
        - warning
        - info
        - total
      properties:
        style:
          type: integer
          minimum: 0
        bug:
          type: integer
          minimum: 0
        security:
          type: integer
          minimum: 0
        refactor:
          type: integer
          minimum: 0
        generatedTest:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    Review:
      type: object
      required:
        - id
        - source
        - sourceLabel
        - file
        - language
        - code
        - createdAt
        - finding
        - generatedTest
        - summary
      properties:
        id:
          type: string
        source:
          $ref: "#/components/schemas/ReviewSource"
        sourceLabel:
          type: string
          description: >-
            Human-readable origin - "Pasted snippet", or the GitHub file path.
        file:
          type: string
        language:
          type: string
        code:
          type: string
          description: The reviewed code, echoed back so a review renders standalone.
        createdAt:
          type: string
          format: date-time
        finding:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        generatedTest:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedTest"
        summary:
          $ref: "#/components/schemas/ReviewSummary"

    ReviewListResponse:
      type: object
      required: [item]
      properties:
        item:
          type: array
          description: Reviews, newest first.
          items:
            $ref: "#/components/schemas/Review"
